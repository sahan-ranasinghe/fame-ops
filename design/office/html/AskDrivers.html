<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask drivers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
body{margin:0;background:#15181c;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#15181c;-webkit-font-smoothing:antialiased}
a{color:#1e4fa0;text-decoration:none}a:hover{color:#163b78}
*{box-sizing:border-box}
.scr{width:390px;height:844px;display:flex;flex-direction:column;justify-content:flex-end;background:#15181c;overflow:hidden;position:relative}
.dim{position:absolute;inset:0;background:#6b7079;opacity:.35}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:600}
.plate{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;border:1px solid #15181c;border-radius:6px;padding:2px 6px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.blue{background:#e6edf8;color:#1e4fa0}.amber{background:#fdf1cc;color:#8a5a00}.red{background:#fbe4e2;color:#b3261e}.grey{background:#e8e7e2;color:#3c4148}.green{background:#e3f1e4;color:#1e5b24}
.q{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid #e6e4de;background:#fff;width:100%;text-align:left;font-family:inherit;cursor:pointer;color:#15181c;font-size:15px;font-weight:600}
.q.on{border:2px solid #1e4fa0;background:#f4f7fc}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:14px;background:#f2a900;color:#15181c;font-weight:700;font-size:17px;border:0;width:100%;font-family:inherit;cursor:pointer}
.sm{height:34px;font-size:13px;border-radius:9px;width:auto;padding:0 12px}
.av{width:40px;height:40px;border-radius:50%;background:#22272c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.t15{font-size:15px}.t13{font-size:13px}.b{font-weight:600}.mu{color:#6b7079}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:#6b7079;text-transform:uppercase}
.sheet{position:relative;background:#f3f2ee;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);padding:10px 16px 18px;display:flex;flex-direction:column;gap:12px}
.hdl{width:44px;height:5px;border-radius:3px;background:#c9c6bc;align-self:center}
.hd{font-family:Archivo,'IBM Plex Sans',sans-serif;font-weight:800;font-size:24px;line-height:1.05;margin:0}
.d{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e6e4de;border-radius:12px;padding:10px 12px}
.cb{width:24px;height:24px;border-radius:7px;border:2px solid #15181c;display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.cb.on{background:#15181c;color:#fff}
</style>
</helmet>
<div class="scr">
  <div style="position:absolute;left:0;top:0;width:390px;padding:20px;color:#fff">
    <div style="font-family:Archivo,sans-serif;font-weight:800;font-size:28px">Drivers</div>
    <div style="font-size:13px;color:#b9bec6;margin-top:6px">Mon 19 Oct · 6 drivers</div>
  </div>
  <div class="dim" aria-hidden="true"></div>

  <div class="sheet" role="dialog" aria-label="Ask drivers">
    <div class="hdl" aria-hidden="true"></div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h2 class="hd">Ask drivers</h2>
      <a href="DriversBoard.dc.html" aria-label="Close" style="width:40px;height:40px;border-radius:10px;background:#fff;border:1px solid #e6e4de;display:inline-flex;align-items:center;justify-content:center;color:#15181c"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></a>
    </div>

    <span class="lbl">Question</span>
    <button class="q on" type="button" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14M3 12l2-6h14l2 6v5h-2M5 17v-5h14"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/></svg>Free for a trip? <span class="t13 mu" style="font-weight:500">Tue 20 Oct · 07:24–15:40 · Kurunegala</span></button>
    <div style="display:flex;gap:8px">
      <button class="q" type="button" aria-pressed="false" style="font-size:14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>When at the office?</button>
      <button class="q" type="button" aria-pressed="false" style="font-size:14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-7.1 7-12a7 7 0 1 0-14 0c0 4.9 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>Where are you?</button>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between">
      <span class="lbl">Send to · 3 picked</span>
      <a href="AskDrivers.dc.html" style="font-size:13px;font-weight:600">All free · None</a>
    </div>
    <label class="d"><span class="cb on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></span><input type="checkbox" checked style="position:absolute;left:-9999px"><div class="av">K</div><div style="flex:1;min-width:0"><div class="t15 b">Kamal</div><div class="t13 mu">On duty · free all day</div></div><span class="chip green">Yes · <span class="mono">09:14</span></span><a href="TripWho.dc.html" class="btn sm">Use</a></label>
    <label class="d"><span class="cb on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></span><input type="checkbox" checked style="position:absolute;left:-9999px"><div class="av">R</div><div style="flex:1;min-width:0"><div class="t15 b">Ruwan</div><div class="t13 mu">On duty · free till <span class="mono">13:00</span></div></div><span class="chip grey">waiting…</span></label>
    <label class="d"><span class="cb on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></span><input type="checkbox" checked style="position:absolute;left:-9999px"><div class="av">N</div><div style="flex:1;min-width:0"><div class="t15 b">Nimal</div><div class="t13 mu">Off duty</div></div><span class="chip amber">Call me</span><a href="tel:+94770000000" class="btn sm" style="background:#fff;border:1.5px solid #15181c">Call</a></label>
    <label class="d" style="opacity:.6"><span class="cb"></span><input type="checkbox" style="position:absolute;left:-9999px"><div class="av">S</div><div style="flex:1;min-width:0"><div class="t15 b">Sunil</div><div class="t13 mu">On a task till <span class="mono">10:40</span></div></div></label>

    <button class="btn" type="button">Send to 3 drivers</button>
    <div class="t13 mu" style="text-align:center">They answer with one tap. Answers show here and in Notifications. This question closes when the trip starts.</div>
  </div>
</div>
</x-dc>

</html>
