<style>
body{margin:0;background:#e9e7e0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#15181c;-webkit-font-smoothing:antialiased}
a{color:#1e4fa0;text-decoration:none}a:hover{color:#163b78}
*{box-sizing:border-box}
.scr{width:390px;height:844px;display:flex;flex-direction:column;background:#e9e7e0;overflow:hidden;position:relative}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:600}
.plate{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;border:1px solid #15181c;border-radius:6px;padding:2px 6px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:6px 11px;white-space:nowrap;background:#fff;color:#3c4148;box-shadow:0 1px 4px rgba(0,0,0,.15);border:0;font-family:inherit;cursor:pointer}
.chip.on{background:#15181c;color:#fff}
.blue{background:#e6edf8;color:#1e4fa0;box-shadow:none}.grey{background:#e8e7e2;color:#3c4148;box-shadow:none}
.ibw{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:#fff;color:#15181c;flex:none;border:1px solid #d9d6cd;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.ibw.on{background:#15181c;color:#fff;border-color:#15181c}
.ib{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid #e6e4de;background:#fff;color:#15181c;cursor:pointer;flex:none}
.t15{font-size:15px}.t13{font-size:13px}.t12{font-size:12px}.b{font-weight:600}.mu{color:#6b7079}
.mk{position:absolute;width:40px;height:40px;border-radius:50%;background:#22272c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:3px solid #1e4fa0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.mk.free{border-color:#2e7d32}.mk.off{border-color:#9aa0a8;opacity:.7}
.mlbl{position:absolute;background:#fff;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.18);white-space:nowrap}
.gap{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #9aa0a8;display:flex;align-items:center;justify-content:center}
.sheet{position:absolute;left:0;right:0;bottom:76px;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.14);padding:10px 16px 12px;display:flex;flex-direction:column;gap:10px}
.hdl{width:44px;height:5px;border-radius:3px;background:#d9d6cd;align-self:center}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid #efede8}
.row:first-of-type{border-top:0}
.av{width:40px;height:40px;border-radius:50%;background:#22272c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid #e6e4de;display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#6b7079;padding:8px 10px;border-radius:999px;min-width:58px;position:relative}
.tab.on{background:#f2a900;color:#15181c}
